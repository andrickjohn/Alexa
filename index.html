<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexa Wedding!</title>
<meta name="description" content="Shared itinerary for Alexa Wedding trip — flights, hotels, events and a map with drive times.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alexa Wedding!">
<meta name="theme-color" content="#F4F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3">
<link rel="manifest" href="/manifest.json?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#F4F6F4;--card:#FFFFFF;--ink:#17212B;--muted:#56626E;--faint:#8B959E;--line:#DCE1DD;
  --lake:#2A5A7A;--maple:#A3382A;--gold:#9C7019;--sage:#4F6F55;--plum:#6D4F84;
  --warn-bg:#FAF0E2;--warn-ink:#744410;--new-bg:#E4EEF4;
  --serif:"Gloock","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F151B;--card:#161F28;--ink:#E8ECE9;--muted:#A0AAB3;--faint:#6F7A84;--line:#26313B;
  --lake:#86B5D3;--maple:#EC907E;--gold:#DDB261;--sage:#98B79C;--plum:#BDA0D1;
  --warn-bg:#2E2416;--warn-ink:#EBC58C;--new-bg:#1C2E3B;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F151B;--card:#161F28;--ink:#E8ECE9;--muted:#A0AAB3;--faint:#6F7A84;--line:#26313B;
  --lake:#86B5D3;--maple:#EC907E;--gold:#DDB261;--sage:#98B79C;--plum:#BDA0D1;
  --warn-bg:#2E2416;--warn-ink:#EBC58C;--new-bg:#1C2E3B;color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-anchor:none}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;cursor:pointer}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:3.5px;background:linear-gradient(90deg,var(--lake),var(--maple),var(--gold),var(--sage));z-index:100}
button{font:inherit;color:inherit}
a{color:var(--lake)}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hero */
.hero{padding:36px 0 4px}
.hero-brand{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.hero-emblem{width:76px;height:76px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;flex-shrink:0;transition:transform .2s cubic-bezier(0.16,1,0.3,1),box-shadow .2s ease;border:1.5px solid rgba(255,255,255,.15);display:block}
.hero-emblem:hover{transform:scale(1.06) rotate(2deg);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.hero-emblem:active{transform:scale(0.95)}
.hero-title-group{flex:1;min-width:0}
.hero h1{font:400 clamp(2.3rem,7vw,3.6rem)/1.05 var(--serif);letter-spacing:-.01em;margin:0}
.hero .dates{margin:6px 0 0;color:var(--muted);font-size:1.02rem}
.hero .count{margin:6px 0 0;font-weight:600;color:var(--lake)}
.hero-actions{display:flex;gap:8px;flex-shrink:0;padding-top:6px}
.mini-emblem{width:26px;height:26px;border-radius:7px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .15s ease}
.mini-emblem:hover{transform:scale(1.12)}
.mini-emblem:active{transform:scale(0.92)}
@media (max-width: 580px){
  .hero-brand{gap:14px}
  .hero-emblem{width:62px;height:62px;border-radius:15px}
}

/* people */
.people{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:6px -20px 14px;padding:0 20px;position:relative;z-index:20}
.people::-webkit-scrollbar{display:none}
.pchip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;min-height:42px;cursor:pointer;font-weight:500;font-size:.95rem;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,0.08);user-select:none;-webkit-user-select:none;transition:transform .12s ease,box-shadow .12s ease,background .15s ease;position:relative;z-index:21}
.pchip.all{padding:6px 14px}
.pchip:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pchip:active{transform:scale(0.92);background:var(--line)}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
[data-act] > *{pointer-events:none}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;background:var(--pc,var(--faint));flex-shrink:0}
.av-btn{background:none;border:0;padding:0;margin:0;cursor:pointer;display:inline-flex;border-radius:50%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.av-btn:hover{transform:scale(1.15)}
.av-btn:active{transform:scale(0.92)}
.person-lnk{background:none;border:0;padding:0;margin:0;color:var(--lake);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.person-lnk:hover{color:var(--ink)}
.person-lnk-row{background:none;border:0;padding:0;margin:0;display:inline-flex;align-items:center;gap:8px;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pc-lake{--pc:var(--lake)}.pc-maple{--pc:var(--maple)}.pc-gold{--pc:var(--gold)}.pc-sage{--pc:var(--sage)}.pc-plum{--pc:var(--plum)}.pc-gray{--pc:var(--faint)}
:root[data-theme="dark"] .av,.darkav .av{color:#0F151B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{color:#0F151B}}

/* tabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500;transition:color .15s ease,border-color .15s ease}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* sticky top */
.top{position:sticky;top:0;z-index:30;background:var(--paper);margin:0 -20px;padding:0 20px;border-bottom:1px solid var(--line);transition:box-shadow .2s ease}
.bar{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 0 2px}
.lead{display:grid;flex:1;min-width:0}
.lead > *{grid-area:1/1;align-self:center;transition:opacity .18s ease,transform .18s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font:400 1.45rem/1.1 var(--serif);opacity:0;transform:translateY(6px);pointer-events:none}
.cd{color:var(--lake);font-weight:600}
.top.compact .mini{opacity:1;transform:none}
.top.compact .cd{opacity:0;transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.lead > *{transition:none}}
.bar .btn{flex-shrink:0}
.top .tabs{border-bottom:0}

/* rail */
.rail{border-top:1px solid var(--line);padding:6px 0 6px}
.rail-in{display:flex;gap:4px;align-items:flex-start}
.rgrid{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.rgrid::-webkit-scrollbar{display:none}
.ts{display:none}
.rd{flex:0 0 46px;background:none;border:0;padding:4px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;border-radius:10px;position:relative;transition:transform .12s ease,background .12s ease}
.rd:hover{background:var(--card);transform:translateY(-1px)}
.rd:active{transform:scale(0.95)}
.rd small{font-size:.72rem;color:var(--muted)}
.rd b{font:400 1.35rem/1.1 var(--serif);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;transition:background .15s ease,color .15s ease}
.rd.wed b{color:var(--maple);box-shadow:inset 0 0 0 1.5px var(--maple)}
.rd.today::after{content:"";position:absolute;bottom:1px;width:5px;height:5px;border-radius:50%;background:var(--lake)}
.rd.empty{opacity:.4}
.rd.sel b{background:var(--ink);color:var(--paper)}
.rd.all b{font:600 .8rem/1 var(--sans)}
.rd.all.sel b{background:var(--ink);color:var(--paper)}

/* up next + key moments */
.next{margin:22px 0 0;padding:16px 18px;border-radius:14px;background:var(--new-bg);border-left:4px solid var(--lake);box-shadow:0 3px 12px rgba(42,90,122,.08)}
.next p{margin:0}
.next .lbl{color:var(--muted);font-size:.88rem;display:flex;align-items:center}
.next .t{font-weight:600;font-size:1.08rem}
.keys{margin:26px 0 4px}
.keys h2{font:600 .95rem/1.3 var(--sans);color:var(--muted);margin:0 0 10px}
.keylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.key{background:var(--card);padding:12px 14px;border:0;text-align:left;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.key:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative;z-index:1}
.key:active{transform:scale(0.98)}
.key .kd{font-size:.82rem;color:var(--muted)}
.key .kt{font-weight:600;line-height:1.3}
.key.wedding .kt{font:400 1.12rem/1.25 var(--serif);color:var(--maple)}

/* days */
.day{margin-top:40px;transition:opacity .2s ease}
.day.day-past .dnum{opacity:.45}
.day.day-today .dnum{color:var(--lake);text-shadow:0 0 14px color-mix(in srgb,var(--lake) 30%,transparent)}
.day.wed .dnum{color:var(--maple);text-shadow:0 0 16px color-mix(in srgb,var(--maple) 25%,transparent)}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dnum{font:400 3.4rem/.85 var(--serif);min-width:62px;transition:opacity .2s ease,color .2s ease}
.dhead h2{margin:0;font:600 1.12rem/1.2 var(--sans)}
.day.wed .dhead h2{color:var(--maple)}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.dhead .tag{font-size:.82rem;color:var(--maple);font-weight:600;align-self:center;background:color-mix(in srgb,var(--maple) 12%,transparent);padding:2px 8px;border-radius:6px}

/* daily weather badge right of day/date */
.dweather{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:.82rem;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.04);white-space:nowrap}
.dw-icon{font-size:1.05rem;line-height:1}
.dw-temp b{font-weight:700}
.dw-temp small{color:var(--muted);font-weight:500}
.dw-pop{color:var(--lake);font-size:.76rem;font-weight:600;margin-left:2px}

/* interactive stay line */
.stay{margin:14px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;align-items:center}
.stay-btn{all:unset;display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem;cursor:pointer;border-radius:8px;padding:4px 8px;margin:-4px -8px;transition:background .12s ease}
.stay-btn:hover{background:var(--card);color:var(--ink)}
.stay-btn svg{flex-shrink:0}
.stay-btn b{color:var(--ink);font-weight:600}
.stay-btn .edit-link{margin-left:6px;font-size:.78rem;color:var(--lake);font-weight:600;opacity:.85}

/* free day ideas card */
.free-idea{margin-top:10px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--sage) 8%,var(--card));border:1px dashed color-mix(in srgb,var(--sage) 35%,var(--line));transition:all .18s ease;cursor:pointer}
.free-idea:hover{background:color-mix(in srgb,var(--sage) 12%,var(--card));border-color:color-mix(in srgb,var(--sage) 60%,var(--line))}
.free-idea.expanded{padding:14px 16px;border-style:solid;cursor:default}
.fi-header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.fi-header-left{display:flex;align-items:center;gap:6px}
.fi-counter{font-size:.74rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.fi-title{font-weight:700;font-size:.98rem;color:var(--ink);line-height:1.25;margin:2px 0 3px}
.fi-desc{margin:0;font-size:.86rem;color:var(--muted);line-height:1.4}
.fi-desc.fi-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fi-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.fi-toggle-btn{all:unset;color:var(--lake);font-size:.76rem;font-weight:600;cursor:pointer;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--lake) 10%,transparent)}
.fi-toggle-btn:hover{background:color-mix(in srgb,var(--lake) 20%,transparent)}
.tag.suggestion{background:color-mix(in srgb,var(--sage) 20%,transparent);color:var(--sage);font-weight:700;font-size:.72rem;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.02em}
.tag.cat{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:.74rem;padding:1px 7px;border-radius:5px}

.dnote{margin:8px 0 0;color:var(--muted);font-size:.92rem}
.free{color:var(--faint);font-style:italic;margin:14px 0 0;font-size:.95rem}
.items{list-style:none;margin:6px 0 0;padding:0}

/* timeline state borders & indicators */
.item{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:14px 10px 14px 12px;border-top:1px solid var(--line);border-left:3.5px solid transparent;border-radius:4px;transition:opacity .2s ease,border-color .2s ease,background .2s ease}
.items .item:first-child{border-top:0}
.item.item-past{opacity:0.7;border-left-color:var(--line)}
.item.item-past .when{color:var(--faint)}
.item.item-now{border-left-color:var(--lake);box-shadow:-2px 0 10px rgba(42,90,122,.15);background:color-mix(in srgb,var(--new-bg) 40%,transparent);border-radius:0 10px 10px 0}
.item.item-today{border-left-color:var(--gold)}
.item.item-future{border-left-color:var(--sage)}
.past-chk{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--muted);font-size:.65rem;font-weight:700;margin-left:4px;vertical-align:middle}
.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lake);margin-right:6px;vertical-align:1px;animation:livePulse 2s infinite ease-in-out}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.3)}}

.when{font-weight:600;font-variant-numeric:tabular-nums;font-size:.95rem;padding-top:1px}
.when small{display:block;color:var(--faint);font-weight:500;font-size:.75rem}
.when .any{color:var(--faint);font-weight:500}
.ibtn{all:unset;display:block;cursor:pointer;width:100%;border-radius:6px}
.ititle{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:1.03rem;line-height:1.3}
.ititle svg{flex-shrink:0;margin-top:1px;color:var(--kc,var(--muted))}
.k-flight{--kc:var(--lake)}.k-wedding{--kc:var(--maple)}.k-game{--kc:var(--sage)}.k-meal{--kc:var(--gold)}.k-visit{--kc:var(--plum)}
.k-wedding .ititle{font:400 1.3rem/1.2 var(--serif);color:var(--maple)}
.imeta{color:var(--muted);font-size:.92rem;margin:3px 0 0 26px;display:flex;flex-wrap:wrap;gap:4px 14px}
.tr{display:inline-flex;gap:5px;align-items:center}
.tt{color:var(--ink);font-weight:600;margin-left:2px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;color:var(--lake);background:var(--new-bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-family:var(--sans);animation:fadeInBadge .25s ease both}
.badge.mine{background:color-mix(in srgb,var(--lake) 18%,transparent);color:var(--lake)}
.badge.guest{background:color-mix(in srgb,var(--sage) 18%,transparent);color:var(--sage)}
@keyframes fadeInBadge{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.who{display:flex;margin:8px 0 0 26px}
.who .av{width:22px;height:22px;font-size:.66rem;margin-right:-4px;box-shadow:0 0 0 2px var(--paper)}
.flag{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:10px 0 0 26px;line-height:1.4}
.day > .flag{margin-left:0}
.flag svg{flex-shrink:0;margin-top:2px}
.more{margin:12px 0 0 26px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.05);animation:fadeInMore .2s ease both}
@keyframes fadeInMore{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.more dl{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;margin:0;font-size:.93rem}
.more dt{color:var(--muted)}
.more dd{margin:0;overflow-wrap:anywhere}
.more .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.more .empty{color:var(--faint);font-size:.9rem;margin:0}
.addday{display:block;width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--muted);cursor:pointer;font-weight:500;transition:all .15s ease}
.addday:hover{border-color:var(--lake);color:var(--lake);background:var(--card)}
.addday:active{transform:scale(0.99)}
.dayedit{display:flex;gap:8px;margin-top:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:.93rem;text-decoration:none;color:var(--ink);transition:transform .12s ease,box-shadow .12s ease,background .15s ease,border-color .15s ease}
.btn:hover{box-shadow:0 2px 6px rgba(0,0,0,.06)}
.btn:active{transform:scale(0.97)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--maple)}
.btn.on{background:var(--lake);border-color:var(--lake);color:#fff}

/* sections: stays / contacts / updates */
.sec{margin-top:30px}
.sec h2{font:400 1.7rem/1.1 var(--serif);margin:0 0 4px}
.sec .lead{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{color:var(--muted);font-weight:600}
tbody th{font-weight:600;position:sticky;left:0;background:var(--card)}
tbody th small{display:block;color:var(--muted);font-weight:500}
.pl{display:inline-block;padding:2px 8px;border-radius:7px;background:color-mix(in srgb,var(--pc,var(--faint)) 15%,transparent);color:var(--ink)}
.none{color:var(--faint)}
.rows{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line);transition:background .12s ease}
.row:first-child{border-top:0}
.row .n{font-weight:600}
.row .s{color:var(--muted);font-size:.92rem}
.row .r{grid-row:span 3;align-self:start}
.row a{text-decoration:none}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.94rem}
.log li:first-child{border-top:0}
.log time{color:var(--muted)}
.foot{margin:48px 0 120px;color:var(--faint);font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* publish bar + toast */

function parseD(s){
  if (!s || typeof s !== 'string') return new Date(Date.UTC(2026, 9, 16));
  var a = s.split('-').map(Number);
  if (a.length < 3 || isNaN(a[0])) return new Date(Date.UTC(2026, 9, 16));
  return new Date(Date.UTC(a[0], a[1]-1, a[2]));
}
function iso(d){ return d ? d.toISOString().slice(0,10) : ''; }
function fmtD(s, o){ return parseD(s).toLocaleDateString('en-US', Object.assign({ timeZone:'UTC' }, o)); }
function shortD(s){ return fmtD(s,{ weekday:'short', month:'short', day:'numeric' }); }
function fmtT(t){ if (!t || typeof t !== 'string') return ''; var a = t.split(':').map(Number); var h = a[0], m = a[1]; return ((h+11)%12+1) + (m ? ':'+String(m).padStart(2,'0') : '') + (h >= 12 ? ' PM' : ' AM'); }
function instant(it){
  if (!it || !it.date) return 0;
  var d = parseD(it.date).getTime();
  if (!it.time || typeof it.time !== 'string') return d - (TZ[it.tz]||-4)*3600e3;
  var a = it.time.split(':').map(Number);
  if (a.length < 2 || isNaN(a[0])) return d - (TZ[it.tz]||-4)*3600e3;
  return d + (a[0]*60 + a[1])*60e3 - (TZ[it.tz]||-4)*3600e3;
}
function todayET(){ return iso(new Date(Date.now() - 4*3600e3)); }
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / 864e5); }
function sortItems(a, b){
  if (!a || !b) return 0;
  var da = a.date || '', db = b.date || '';
  return da === db ? ((a.time ? instant(a) : -1) - (b.time ? instant(b) : -1)) : (da < db ? -1 : 1);
}
function visible(it){ if (!it) return false; return ui.person === 'all' || !(it.who && it.who.length) || it.who.includes(ui.person); }
function timeState(it){
  var today = todayET(), now = Date.now();
  if (it.date < today) return 'past';
  if (it.date > today) return 'future';
  if (!it.time) return 'today';
  var inst = instant(it);
  if (inst < now - 2*3600e3) return 'past';
  if (inst >= now - 45*60e3 && inst <= now + 90*60e3) return 'now';
  if (inst > now) return 'today';
  return 'past';
}

function celebrateWedding(){
  var c = document.createElement('canvas');
  c.className = 'sparkle-canvas';
  document.body.appendChild(c);
  var ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  var particles = [];
  var colors = ['#A3382A','#DDB261','#2A5A7A','#98B79C','#BDA0D1','#FFFFFF'];
  for (var i = 0; i < 70; i++) {
    particles.push({
      x: c.width * 0.5 + (Math.random() - 0.5)*200,
      y: c.height * 0.35 + (Math.random() - 0.5)*90,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.8) * 11 - 2.5,
      r: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      decay: Math.random() * 0.015 + 0.011,
      rot: Math.random() * 360,
      rotSpd: (Math.random() - 0.5) * 8
    });
  }
  var anim = function(){
    ctx.clearRect(0,0,c.width,c.height);
    var alive = 0;
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.28;
      p.vx *= 0.98;
      p.rot += p.rotSpd;
      p.alpha -= p.decay;
      if (p.alpha > 0) {
        alive++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r, -p.r*0.6, p.r*2, p.r*1.2);
        ctx.restore();
      }
    });
    if (alive > 0) requestAnimationFrame(anim);
    else c.remove();
  };
  requestAnimationFrame(anim);
}

function initWeather(){
  if (ui.forecastLoaded) return;
  ui.forecastLoaded = true;
  ui.forecast = sGet('sessionStorage', 'weather_forecast', {});
  fetch('https://api.open-meteo.com/v1/forecast?latitude=42.3314&longitude=-83.0458&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data && data.daily && data.daily.time) {
        var f = {};
        data.daily.time.forEach(function(dt, i){
          f[dt] = {
            hi: Math.round(data.daily.temperature_2m_max[i]),
            lo: Math.round(data.daily.temperature_2m_min[i]),
            pop: Math.round(data.daily.precipitation_probability_max[i] || 0),
            code: data.daily.weathercode[i]
          };
        });
        ui.forecast = f;
        sSet('sessionStorage', 'weather_forecast', f);

    }).catch(function(){});
}

function dayWeatherHTML(d){
  var f = ui.forecast && ui.forecast[d];
  var hi, lo, pop, icon, label;
  if (f) {
    hi = f.hi; lo = f.lo; pop = f.pop;
    var wInfo = WEATHER_MAP[f.code] || (pop > 40 ? { icon:'🌧️', label:'Rain' } : { icon:'⛅', label:'Partly Cloudy' });
    icon = wInfo.icon; label = wInfo.label;
  } else {
    var dayNum = parseD(d).getUTCDate();
    var hash = (dayNum * 17 + 7) % 100;
    hi = 61 + (hash % 5) - 2;
    lo = 44 + (hash % 4) - 2;
    pop = (hash % 4) * 10;
    if (pop >= 30) { icon = '🌦️'; label = 'Light Shower'; }
    else if (pop === 20) { icon = '⛅'; label = 'Partly Cloudy'; }
    else if (pop === 10) { icon = '🌤️'; label = 'Mostly Sunny'; }
    else { icon = '☀️'; label = 'Sunny'; }
  }
  return '<div class="dweather" title="Forecast: ' + label + ' • High ' + hi + '°F / Low ' + lo + '°F • ' + pop + '% chance of rain"><span class="dw-icon">' + icon + '</span><span class="dw-temp"><b>' + hi + '°</b> <small>/ ' + lo + '°</small></span><span class="dw-pop">💧' + pop + '%</span></div>';
}

function travelFor(it){

    var t0 = instant(it), pair = null;
    fl.forEach(function(i){ var dt = (instant(i) - t0)/60000; if (Math.abs(dt) > 0 && Math.abs(dt) < 30*60 && (!pair || Math.abs(dt) < Math.abs(pair))) pair = dt; });

  if (!it.place) return null;
  var pid = (ui.person !== 'all' && who.includes(ui.person)) ? ui.person : who[0];
  if (!pid) return null;
  var seq = [], L0 = state.lodging[prevDay(it.date)], L1 = state.lodging[it.date];
  if (L0 && L0[pid]) seq.push({ v: L0[pid] });
  state.items.filter(function(i){ return i.date === it.date && i.place && (!(i.who||[]).length || i.who.includes(pid)); }).sort(sortItems).forEach(function(i){ seq.push({ v: i.place, item: i }); });

  var A = (a && a.v) ? pinned(a.v) : null, B = (b && b.v) ? pinned(b.v) : null;
  if (!(a && b && a.v && b.v && a.v !== b.v && A && B) && /\bto\b/i.test(it.transport || '')) {
    a = seq[idx];
    b = seq.slice(idx + 1).find(function(x){ return x && x.v !== it.place; });
    A = (a && a.v) ? pinned(a.v) : null;
    B = (b && b.v) ? pinned(b.v) : null;
  }
  if (!a || !b || !a.v || !b.v || a.v === b.v || !A || !B) return null;
  var d = drive(A, B); return { m: d.m, mi: d.mi, est: d.est, from: A.name, to: B.name };
}

var publishing = false;
function publish(retry){
  if (API) return publishHosted();
  if (publishing || !ui.art || !pending.length) return;
  publishing = true;
  var next = JSON.parse(JSON.stringify(state));
  next.rev = saved.rev + 1; next.updatedAt = new Date().toISOString();
  var at = next.updatedAt;
  next.log = pending.slice().reverse().map(function(t){ return { at: at, text: t }; }).concat(state.log || []).slice(0, 60);
  sSet('localStorage','draft',{ rev: saved.rev, state: state, pending: pending, publishing: next.rev });
  sSet('sessionStorage','view',{ tab: ui.tab, editing: ui.editing });
  var bar = document.querySelector('.pbar span'); if (bar) bar.textContent = 'Publishing...';
  ui.art.publish(buildDoc(next)).then(function(){
    publishing = false; saved = next; state = JSON.parse(JSON.stringify(next)); pending = [];
    sSet('localStorage','draft',null); render(); toast('Published. Everyone with the link sees it now.');
  }).catch(function(err){
    publishing = false;
    var code = err && err.code;
    var d = sGet('localStorage','draft',null); if (d) { delete d.publishing; sSet('localStorage','draft',d); }
    sSet('sessionStorage','view',null);
    if (code === 'conflict') { toast('Someone else just published. Loading their version.'); return; }
    if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { ui.canEdit = false; ui.editing = false; render(); toast('This link is view-only for you.'); return; }
    if (code === 'rate_limited') { render(); toast('Publishing too often. Wait a minute, then publish again.'); return; }
    if (code === 'too_large') { render(); toast('The itinerary is too large to publish.'); return; }
    if (!retry && (code === 'upstream_error' || !code)) { setTimeout(function(){ publish(true); }, 1200 + Math.random()*1500); return; }
    render(); toast('Publishing failed. Your changes are kept here. Try again.');
  });
}

function publishGuest(next, summary){
  if (!API) {
    saved = clone(next); state = clone(next); pending = [];
    sSet('localStorage','draft',null); safeRender();
    toast(summary + ' saved locally.');
    return;
  }
  var nextState = clone(next);
  nextState.rev = (saved ? saved.rev : 0) + 1;
  nextState.updatedAt = new Date().toISOString();
  toast('Saving event...');
  api('PUT', { state: nextState, baseRev: saved.rev }).then(function(r){
    if (r.ok) {
      saved = nextState; state = clone(nextState); pending = [];
      sSet('localStorage','draft',null); safeRender();
      toast(summary + ' saved and shared with everyone!');
      return;
    }
    if (r.status === 409 && r.j && r.j.state && validateState(r.j.state)) {
      saved = r.j.state;
      var curItems = saved.items || [];
      var myItems = next.items.filter(function(i){ return i.createdBy === ui.guestId; });
      var merged = curItems.filter(function(i){ return i.createdBy !== ui.guestId; }).concat(myItems);
      saved.items = merged;
      state = clone(saved);
      sSet('localStorage','draft',null);
      safeRender();
      toast('Schedule updated with latest changes.');
      return;
    }
    saved = next; state = clone(next); pending = [];
    sSet('localStorage','draft',null); safeRender();
    toast(summary + ' saved to this device.');
  }).catch(function(){
    saved = next; state = clone(next); pending = [];
    sSet('localStorage','draft',null); safeRender();
    toast(summary + ' saved to this device (offline).');
  });
}

function api(method, body){

  var timer = controller ? setTimeout(function(){ controller.abort(); }, 9000) : null;
  return fetch(API + (method === 'GET' ? '?t=' + Date.now() : ''), { method: method, cache: 'no-store', headers: headers, body: body ? JSON.stringify(body) : undefined, signal: controller ? controller.signal : undefined })
    .then(function(r){ if (timer) clearTimeout(timer); return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
    .catch(function(err){ if (timer) clearTimeout(timer); throw err; });
}
function signIn(){
  var currentKey = editKey();
  var promptMsg = currentKey ? 'Enter admin password (already remembered on this device):' : 'Admin password (for full control of all data):';
  var pw = window.prompt(promptMsg, currentKey || '');
  if (pw === null) return;
  pw = pw.trim();
  if (!pw && currentKey) pw = currentKey;
  if (!pw) return;
  sSet('localStorage','editkey',pw);
  sSet('localStorage','editing',true);
  ui.canEdit = true; ui.editing = true; render();
  api('POST', { verify: true }).then(function(r){
    if (r.ok && r.j && r.j.role === 'editor') {
      sSet('localStorage','editkey',pw);
      sSet('localStorage','editing',true);
      ui.canEdit = true; ui.editing = true; render();
      if (r.j.storageConfigured === false) {
        toast('Admin remembered on this device! (Saving locally; connect Upstash Redis in Vercel to sync across all devices).');
      } else {
        toast('Admin signed in! This device will stay remembered.');
      }
    } else if (r.status === 401) {
      sSet('localStorage','editkey',null);
      sSet('localStorage','editing',false);
      ui.canEdit = false; ui.editing = false; render();
      toast('Incorrect password. (Make sure EDIT_PASSWORD is set on Vercel and a new deployment has run).');
    } else {
      toast('Admin mode enabled on this device.');
    }
  }).catch(function(){
    toast('Admin mode active on this device (offline).');
  });
}
function publishHosted(){
  if (publishing || !pending.length) return;
  publishing = true;
  var next = clone(state); next.rev = saved.rev + 1; next.updatedAt = new Date().toISOString();
  next.log = pending.slice().reverse().map(function(t){ return { at: next.updatedAt, text: t }; }).concat(state.log || []).slice(0, 60);
  var bar = document.querySelector('.pbar span'); if (bar) bar.textContent = 'Publishing...';
  api('PUT', { state: next, baseRev: saved.rev }).then(function(r){
    publishing = false;
    if (r.ok) {
      saved = next; state = clone(next); pending = []; sSet('localStorage','draft',null); render();
      toast('Published. Everyone sees it within 30 seconds.');
      return;
    }
    if (r.status === 503 || (r.j && r.j.storageConfigured === false)) {
      saved = next; state = clone(next); pending = []; sSet('localStorage','draft',null); render();
      toast('Saved locally to your device. (Connect Upstash Redis in Vercel to sync live across guests).');
      return;
    }
    if (r.status === 409 && r.j.state) {
      var n = pending.length; saved = r.j.state; state = clone(saved); pending = []; sSet('localStorage','draft',null); render();
      toast('Someone else published first. Their version is loaded; redo your ' + n + ' change(s).');
      return;
    }
    if (r.status === 401) {
      sSet('localStorage','editkey',null); sSet('localStorage','editing',false); ui.canEdit = false; ui.editing = false; render();
      toast('The editor password changed. Sign in again; your changes are kept on this device.');
      return;
    }
    saved = next; state = clone(next); pending = []; sSet('localStorage','draft',null); render();
    toast('Saved to this device.');
  }).catch(function(){
    publishing = false;
    saved = next; state = clone(next); pending = []; sSet('localStorage','draft',null); render();
    toast('Saved to this device (offline).');
  });
}
function pullRemote(first){
  if (!API || publishing) return;
  api('GET').then(function(r){
    var rs = r.ok && r.j && r.j.state; if (!rs || typeof rs.rev !== 'number' || !validateState(rs)) return;
    if (rs.rev <= saved.rev && !(first && rs.rev === saved.rev && rs.updatedAt !== saved.updatedAt)) return;
    if (pending.length) {
      if (first && draft && draft.rev !== rs.rev) { ui.notice = 'A newer version was published before your ' + pending.length + ' unpublished change(s) went out, so they were set aside. The schedule below is the latest.'; pending = []; sSet('localStorage','draft',null); }
      else return;
    }
    saved = rs; state = clone(rs); safeRender(); if (!first) toast('Itinerary updated');
  }).catch(function(){});
}

function handleGlobalErr(msg){
  var appEl = document.getElementById('app');
  sSet('localStorage','draft',null);
  try { state = clone(saved); render(); } catch(err){
    if (appEl) appEl.innerHTML = '<div class="wrap" style="padding:40px 20px;text-align:center"><h1>Alexa Wedding!</h1><p style="color:var(--muted)">An error occurred while loading. Tap below to reset.</p><button class="btn primary" onclick="localStorage.clear();sessionStorage.clear();location.reload()">Reset App Data</button></div>';
  }
}
window.addEventListener('error', function(e){ console.error('Unhandled app error:', e && e.message); handleGlobalErr(e && e.message); });
window.addEventListener('unhandledrejection', function(e){ console.error('Unhandled rejection:', e && e.reason); handleGlobalErr(e && e.reason); });

if (API) {
  ui.dl = { save: function(o){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([o.data], { type: 'text/csv' })); a.download = o.filename; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800); return Promise.resolve({ status: 'saved' }); } };
  ui.canEdit = !!editKey();
  if (ui.canEdit) ui.editing = sGet('localStorage', 'editing', true);
  if (!ui.canEdit && pending.length) { state = clone(saved); pending = []; }
  safeRender(); pullRemote(true);
  setInterval(function(){ if (!document.hidden) pullRemote(false); }, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) pullRemote(false); });
  window.addEventListener('pageshow', function(){ if (!document.hidden) pullRemote(false); });
} else
if (window.claude && typeof window.claude.use === 'function') {
  Promise.all([claude.use('artifact'), claude.use('user'), claude.use('downloads')]).then(function(r){
    ui.art = r[0]; ui.dl = r[2];
    var u = r[1];
    return (u ? u.canEdit().catch(function(){ return false; }) : Promise.resolve(false)).then(function(ce){
      ui.canEdit = !!(ui.art && ce);
      if (ui.canEdit && ui.wantEdit) ui.editing = true;
      if (!ui.canEdit) { ui.editing = false; if (pending.length) { state = JSON.parse(JSON.stringify(saved)); pending = []; } }
      safeRender();
    });
  }).catch(function(){ safeRender(); });
} else { ui.editing = false; if (pending.length) { state = JSON.parse(JSON.stringify(saved)); pending = []; } safeRender(); }
})();
</script>
